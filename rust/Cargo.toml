[package]
name = "documix-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anydoc = "=0.2.4"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
entities = "1.0.1"
fancy-regex = "0.19.2"
liteparse = "=2.16.0"
mail-parser = "0.11.9"
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "macros", "rt"] }
unicode-general-category = "1.1.0"
zip = "9.0.4"
