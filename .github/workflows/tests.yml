name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # The version-bump bot commit does not change code; skip it.
    if: "!contains(github.event.head_commit.message, '[version-bump]')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the Python fallback with the engines and the pdfplumber extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tables]" pytest

      - name: Show engine availability
        run: python -m documix --version

      - name: Run tests
        run: python -m pytest -q

  rust:
    if: "!contains(github.event.head_commit.message, '[version-bump]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build prerequisites (Tesseract and Leptonica are compiled from source)
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Python fallback for the parity harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python/[tables]"

      - name: Python vs Rust parity
        run: python scripts/parity.py --rust target/release/documix --python "$(which python)"
