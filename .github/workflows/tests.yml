name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # The version-bump bot commit does not change code; skip it.
    if: "!contains(github.event.head_commit.message, '[version-bump]')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install documix with the engines and the pdfplumber extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tables]" pytest

      - name: Show engine availability
        run: python -m documix --version

      - name: Run tests
        run: python -m pytest -q
