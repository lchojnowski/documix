[package]
name = "documix"
version = "1.20261017.3"
description = "Compile a folder of documents into one Markdown file (anydoc + LiteParse engines)"
license = "MIT"
edition = "2024"

[dependencies]
anydoc = "=0.2.4"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
entities = "1.0.1"
fancy-regex = "0.19.2"
libc = "0.2.191"
liteparse = "=2.16.0"
mail-parser = "0.11.9"
mimalloc = "0.1.52"
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "macros", "rt"] }
unicode-general-category = "1.1.0"
zip = "9.0.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
